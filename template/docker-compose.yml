version: '3.8'

services:
  app:
    build: .
    ports:
      - '3010:3010'
    environment:
      - NODE_ENV=production
      - DB_DRIVER=sqlite
      - SQLITE_PATH=./data/app.db
    volumes:
      - app-data:/app/data

  # Uncomment for MySQL production setup:
  # mysql:
  #   image: mysql:8.0
