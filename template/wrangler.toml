name = "demo-app"
main = "dist/cloudflare/cloudflare.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# 开发令牌（无密码快速登录，仅限本地调试）——生产默认关闭
ENABLE_DEV_TOKENS = "false"

[[d1_databases]]
binding = "DB"
database_name = "demo-app-db"
# 部署前填入你自己的 D1 实例：npx wrangler d1 create demo-app-db
database_id = ""

[[durable_objects.bindings]]
name = "REALTIME_DO"
class_name = "RealtimeDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotificationDurableObject"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "NotificationDurableObject", to = "RealtimeDurableObject" }]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[dev]
port = 8787
local_protocol = "http"
