name: Deploy Demo

on:
  push:
    branches: [master, main, feat/*]
    paths:
      - 'template/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Demo to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build CLI
        run: npm run build:cli
      - name: Scaffold demo app
        working-directory: /tmp
        run: node ${{ github.workspace }}/dist/cli/index.js demo-app --preset fullstack-admin
      - name: Configure wrangler.toml
        working-directory: /tmp/demo-app
        run: sed -i 's/database_id = "".*$/database_id = "c77a8486-8aa0-45c0-a19a-8a0da73408b9"/' wrangler.toml
      - name: Install demo dependencies
        working-directory: /tmp/demo-app
        # 脚手架本身用 npm install --legacy-peer-deps 装依赖；npm ci 的严格 peer
        # 校验会拒绝 legacy-peer-deps 产出的锁文件（puppeteer/picomatch 等报 Missing）
        run: npm install --legacy-peer-deps
      - name: Build for Cloudflare
        working-directory: /tmp/demo-app
        run: npm run build:cloudflare
      - name: Generate migrations
        working-directory: /tmp/demo-app
        run: npm run db:generate
      - name: Apply D1 migrations (idempotent, per-statement)
        working-directory: /tmp/demo-app
        run: |
          for file in drizzle/0*.sql; do
            echo "Applying $file..."
            # 逐条执行 + IF NOT EXISTS 化：drizzle 产出的 CREATE TABLE 不带
            # IF NOT EXISTS，整文件重放在已有库上必撞（一句失败中断后续建表）
            python3 -c "import sys,re; sql=open(sys.argv[1]).read(); sql=sql.replace('--> statement-breakpoint',';'); sql=re.sub(r'CREATE TABLE (?!IF NOT EXISTS)','CREATE TABLE IF NOT EXISTS ',sql); sql=re.sub(r'CREATE UNIQUE INDEX (?!IF NOT EXISTS)','CREATE UNIQUE INDEX IF NOT EXISTS ',sql); sql=re.sub(r'CREATE INDEX (?!IF NOT EXISTS)','CREATE INDEX IF NOT EXISTS ',sql); open('/tmp/migration.sql','w').write(sql)" "$file"
            npx wrangler d1 execute demo-app-db --remote --file=/tmp/migration.sql 2>&1 | tail -3 || echo "Migration $file had errors (idempotent statements skipped existing objects)"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare Workers
        working-directory: /tmp/demo-app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Health Check
        run: |
          sleep 5
          curl -sf -m 30 https://demo-app.dyyz1993.workers.dev/health || echo "Health check failed (Worker may need time to propagate)"
