name: Deploy Shanbox

on:
  workflow_call:
    inputs:
      version:
        description: 'NPM version to deploy'
        required: true
        type: string
      presets:
        description: 'Comma-separated presets to deploy (empty = all)'
        required: false
        type: string
        default: 'todo-app,minimal,ecommerce,xbrowser-marketplace,fullstack-admin,forum,saas'
  workflow_dispatch:
    inputs:
      version:
        description: 'NPM version to deploy (e.g., 0.4.23)'
        required: true
        type: string
      presets:
        description: 'Comma-separated presets to deploy (empty = all)'
        required: false
        type: string
        default: 'todo-app,minimal,ecommerce,xbrowser-marketplace,fullstack-admin,forum,saas'

jobs:
  deploy:
    name: Deploy Presets to Shanbox
    # shanbox 上的 self-hosted runner（标签 shanbox）：内网 IP 从云 runner 永远不可达，
    # 此前该工作流从未注册/跑通。runner 在目标机上本地执行，SSH 步骤全部拆除
    runs-on: [self-hosted, shanbox]
    environment: shanbox

    steps:

      - name: Install create-fullstack-scaffold
        run: |
          npm uninstall -g create-fullstack-scaffold 2>/dev/null; rm -rf ~/.npm/_npx/; npm install -g create-fullstack-scaffold@${{ inputs.version }} 2>&1 | tail -3
          node -p "require('/usr/lib/node_modules/create-fullstack-scaffold/package.json').version"

      - name: Mark deploying (watchdog mutual exclusion)
        run: touch /root/.deploying
      - name: Kill existing processes
        run: |
          for port in 3011 3013 3014 3015 3016 3018 3020; do pid=$(ss -tlnp | grep ":$port " | grep -oP "pid=\K[0-9]+" | head -1); [ -n "$pid" ] && kill $pid 2>/dev/null; done; echo "All killed"

      - name: Deploy todo-app
        if: contains(inputs.presets, 'todo-app')
        run: |
          mkdir -p /root/env-backup && [ -f /root/todo-app/.env ] && cp /root/todo-app/.env /root/env-backup/todo-app.env || true
          rm -rf /tmp/gen-todo && mkdir -p /tmp/gen-todo && cd /tmp/gen-todo && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js todo-app --preset todo-app --no-install && rm -rf /root/todo-app && mv /tmp/gen-todo/todo-app /root/todo-app
          [ -f /root/env-backup/todo-app.env ] && cp /root/env-backup/todo-app.env /root/todo-app/.env || true
          cd /root/todo-app && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/todo-app && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/todo-app && npm run build 2>&1 | tail -2 && PORT=3011 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/todo-app/app.log 2>&1 &

      - name: Deploy minimal
        if: contains(inputs.presets, 'minimal')
        run: |
          mkdir -p /root/env-backup && [ -f /root/minimal/.env ] && cp /root/minimal/.env /root/env-backup/minimal.env || true
          rm -rf /tmp/gen-minimal && mkdir -p /tmp/gen-minimal && cd /tmp/gen-minimal && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js minimal --preset minimal --no-install && rm -rf /root/minimal && mv /tmp/gen-minimal/minimal /root/minimal
          [ -f /root/env-backup/minimal.env ] && cp /root/env-backup/minimal.env /root/minimal/.env || true
          cd /root/minimal && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/minimal && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/minimal && npm run build 2>&1 | tail -2 && PORT=3013 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/minimal/app.log 2>&1 &

      - name: Deploy ecommerce
        if: contains(inputs.presets, 'ecommerce')
        run: |
          mkdir -p /root/env-backup && [ -f /root/shop/.env ] && cp /root/shop/.env /root/env-backup/shop.env || true
          rm -rf /tmp/gen-ecom && mkdir -p /tmp/gen-ecom && cd /tmp/gen-ecom && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js shop --preset ecommerce --no-install && rm -rf /root/shop && mv /tmp/gen-ecom/shop /root/shop
          [ -f /root/env-backup/shop.env ] && cp /root/env-backup/shop.env /root/shop/.env || true
          cd /root/shop && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/shop && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/shop && npm run build 2>&1 | tail -2 && PORT=3014 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/shop/app.log 2>&1 &

      - name: Deploy xbrowser-marketplace
        if: contains(inputs.presets, 'xbrowser-marketplace')
        run: |
          mkdir -p /root/env-backup && [ -f /root/plugin/.env ] && cp /root/plugin/.env /root/env-backup/plugin.env || true
          rm -rf /tmp/gen-plugin && mkdir -p /tmp/gen-plugin && cd /tmp/gen-plugin && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js plugin --preset xbrowser-marketplace --no-install && rm -rf /root/plugin && mv /tmp/gen-plugin/plugin /root/plugin
          [ -f /root/env-backup/plugin.env ] && cp /root/env-backup/plugin.env /root/plugin/.env || true
          cd /root/plugin && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/plugin && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/plugin && npm run build 2>&1 | tail -2 && PORT=3015 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/plugin/app.log 2>&1 &

      - name: Deploy fullstack-admin
        if: contains(inputs.presets, 'fullstack-admin')
        run: |
          mkdir -p /root/env-backup && [ -f /root/fullstack-admin/.env ] && cp /root/fullstack-admin/.env /root/env-backup/fullstack-admin.env || true
          rm -rf /tmp/gen-fa && mkdir -p /tmp/gen-fa && cd /tmp/gen-fa && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js fullstack-admin --preset fullstack-admin --no-install && rm -rf /root/fullstack-admin && mv /tmp/gen-fa/fullstack-admin /root/fullstack-admin
          [ -f /root/env-backup/fullstack-admin.env ] && cp /root/env-backup/fullstack-admin.env /root/fullstack-admin/.env || true
          cd /root/fullstack-admin && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/fullstack-admin && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/fullstack-admin && npm run build 2>&1 | tail -2 && PORT=3016 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/fullstack-admin/app.log 2>&1 &

      - name: Deploy forum
        if: contains(inputs.presets, 'forum')
        run: |
          mkdir -p /root/env-backup && [ -f /root/forum/.env ] && cp /root/forum/.env /root/env-backup/forum.env || true
          rm -rf /tmp/gen-forum && mkdir -p /tmp/gen-forum && cd /tmp/gen-forum && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js forum --preset forum --no-install && rm -rf /root/forum && mv /tmp/gen-forum/forum /root/forum
          [ -f /root/env-backup/forum.env ] && cp /root/env-backup/forum.env /root/forum/.env || true
          cd /root/forum && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/forum && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/forum && npm run build 2>&1 | tail -2 && PORT=3018 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/forum/app.log 2>&1 &

      - name: Deploy saas
        if: contains(inputs.presets, 'saas')
        run: |
          mkdir -p /root/env-backup && [ -f /root/saas/.env ] && cp /root/saas/.env /root/env-backup/saas.env || true
          rm -rf /tmp/gen-saas && mkdir -p /tmp/gen-saas && cd /tmp/gen-saas && node /usr/lib/node_modules/create-fullstack-scaffold/dist/cli/index.js saas --preset saas --no-install && rm -rf /root/saas && mv /tmp/gen-saas/saas /root/saas
          [ -f /root/env-backup/saas.env ] && cp /root/env-backup/saas.env /root/saas/.env || true
          cd /root/saas && npm install --legacy-peer-deps 2>&1 | tail -2 && npx patch-package 2>&1 | tail -2
          cd /root/saas && NODE_ENV=production npm run db:push 2>&1 | tail -2 || true
          cd /root/saas && npm run build 2>&1 | tail -2 && PORT=3020 NODE_ENV=production ENABLE_DEV_TOKENS=true nohup npm start > /root/saas/app.log 2>&1 &

      - name: Wait for services to start
        run: sleep 15

      - name: Health check
        run: |
          echo "=== HTTPS Health Check ==="
          for sub in todo minimal shop plugin fullstack-admin forum saas; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://${sub}.shanbox.19930810.xyz:8443/)
            echo "$sub: $code"
          done
          echo ""
          echo "=== API Health Check ==="
          curl -s http://localhost:3011/api/todos | head -c 50
          echo ""
          curl -s http://localhost:3014/api/orders-mock | head -c 50
          echo ""
          curl -s http://localhost:3015/api/plugins | head -c 50
          echo ""
          curl -s http://localhost:3018/api/topics | head -c 50
          echo ""
          echo "=== Deploy Complete ==="

      - name: Clear deploying marker
        if: always()
        run: rm -f /root/.deploying
